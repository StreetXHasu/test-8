name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate secrets
        run: bin/generate-secrets

      - name: Install Composer dependencies for image build
        run: docker run --rm -v "$PWD":/app -w /app composer:2 install --no-interaction --prefer-dist --no-scripts --ignore-platform-reqs

      - name: Build prod image
        run: docker build --target prod -t image-api:prod .

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: PHPUnit with 100% coverage
        run: docker compose exec -T app composer test

      - name: PHPStan
        run: docker compose exec -T app composer phpstan
