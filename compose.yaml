services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: app
      POSTGRES_USER: app
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "app", "-U", "app"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro

  garage:
    image: dxflrs/garage:v2.4.0
    entrypoint: ["/garage"]
    command: ["server", "--single-node", "--default-bucket"]
    env_file:
      - .env.local
    ports:
      - "3900:3900"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  app:
    build:
      context: .
      target: test
    env_file:
      - .env.local
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_URL: pgsql://app:app@database:5432/app
      S3_ENDPOINT: http://garage:3900
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    ports:
      - "8080:80"
    depends_on:
      database:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  database_data:
  garage_meta:
  garage_data:
