nelmio_api_doc:
    documentation:
        info:
            title: Image API
            description: Закрытое API загрузки и хранения изображений. PNG и JPEG до 5 МБ, на диске — сжатый WebP, одинаковые файлы не дублируются.
            version: 1.0.0
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
            schemas:
                Error:
                    type: object
                    required: [error]
                    properties:
                        error:
                            type: string
                Image:
                    type: object
                    required: [id, originalFilename, mimeType, sizeBytes, width, height, contentHash, createdAt]
                    properties:
                        id:
                            type: string
                            format: uuid
                        originalFilename:
                            type: string
                        mimeType:
                            type: string
                        sizeBytes:
                            type: integer
                        width:
                            type: integer
                        height:
                            type: integer
                        contentHash:
                            type: string
                        createdAt:
                            type: string
                            format: date-time
                        duplicate:
                            type: boolean
                ImagePage:
                    type: object
                    required: [items, nextCursor]
                    properties:
                        items:
                            type: array
                            items:
                                $ref: '#/components/schemas/Image'
                        nextCursor:
                            type: string
                            nullable: true
        security:
            - Bearer: []
    areas:
        path_patterns:
            - ^/api/(?!doc)
            - ^/health
