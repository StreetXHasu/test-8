# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Exception/'
            - '../src/Kernel.php'
            - '../src/Model/'

    Psr\Clock\ClockInterface:
        class: Symfony\Component\Clock\NativeClock

    App\Security\JwtCodec:
        arguments:
            $secret: '%env(JWT_SECRET)%'
            $ttlSeconds: '%env(int:JWT_TTL)%'

    App\Storage\S3ClientFactory:
        arguments:
            $endpoint: '%env(S3_ENDPOINT)%'
            $region: '%env(S3_REGION)%'
            $accessKey: '%env(S3_ACCESS_KEY)%'
            $secretKey: '%env(S3_SECRET_KEY)%'

    Aws\S3\S3Client:
        factory: ['@App\Storage\S3ClientFactory', 'create']

    App\Storage\S3ObjectStorage:
        arguments:
            $bucket: '%env(S3_BUCKET)%'

    App\Controller\AuthController:
        arguments:
            $authLimiter: '@limiter.auth'
